# Dependency audit exceptions.
#
# One entry per reason, not one per package. Each entry names the packages it
# covers, the advisory ids that were read when it was accepted, who accepted it,
# why, and the date it has to be looked at again. scripts/dep_audit.py fails if
# a package has no entry, if an advisory appears that is not in the list, or if
# a review date has passed. So this file cannot quietly go stale.
#
# The advisories tables are written by `make audit-update`, not by hand. The
# words are written by hand, always.
#
# What "ships" means here: whether the package is in the JavaScript bundle
# Metro builds for the device. That is no longer a guess. On Oct 11, 2026 a
# Release and a Debug bundle were built for the kepler platform with the SDK's
# own Metro configuration and their source maps were read; the inventory is
# results/bundle_packages_2026-10-11.json, with its one caveat (the compiled
# Shaka file was a stub, which cannot change which npm packages are bundled).
# Each group below is exactly the flagged packages that are, or are not, in
# those bundles.
#
# Two packages left this file on Oct 11 because they were fixed rather than
# excused: xmldom 0.6.0, with sixteen advisories in the shipped bundle, is now
# an alias of the maintained fork @xmldom/xmldom 0.8.15 (the Shaka polyfill
# only subclasses its DOMParser, and the 0.8 line keeps the 0.6 parsing
# behaviour), and the app's own lodash moved from 4.17.23 to 4.18.1. Both
# changes still need the Mac's Vega build and a run on the virtual device,
# like every other change to app inputs since Oct 10.
# On Oct 13, handlebars left the tooling exception after a targeted patch to
# 4.7.10 fixed its template-injection advisories, including GHSA-p8wg-vrv2-v86f.

[[exception]]
group = "in-the-device-bundle"
ecosystem = "npm"
ships = true
accepted_by = "Claude, Oct 11 2026 session, on the infrastructure and security lane's reading; for Alex to confirm at the Oct 21 review"
review_by = "2026-10-21"
why = """
Every package here is in the Release bundle built on Oct 11, except
react-devtools-core, which is in the Debug bundle only
(results/bundle_packages_2026-10-11.json). They are Amazon's Vega SDK 0.24
runtime modules, the navigation library's URL parser, lodash, and the React
DevTools backend. The project pins SDK 0.24.9914 and the sample at tag
v0.24-RN83 because that is the pair the device runs; no newer react-native is
supported by Vega 0.24, so "upgrade" is not an option that leaves a working
app.

Not one of the Amazon packages carries an advisory of its own. npm lists them
because of what they depend on, and each chain was read on Oct 11:

- Thirteen of them depend on @amazon-devices/keplerscript-turbomodule-api,
  which depends on jscodeshift, a Node code transformation tool that its code
  generator (rn-codegen/) and its cli.js use. Its runtime entry, dist/index.js,
  requires only its own TurboModuleRegistry, and jscodeshift is in neither
  bundle. The advisory behind it (braces, stack exhaustion on a deeply nested
  brace pattern) needs a glob pattern as input, which the app never produces.
- @amazon-devices/react-native-kepler depends on @microsoft/api-extractor,
  @react-native/community-cli-plugin, babel-jest and jest-environment-node.
  Those are the package's own build, bundling and test tools; none is in
  either bundle.
- @amazon-devices/react-navigation__core depends on query-string, which
  depends on decode-uri-component 0.2.2 (denial of service through
  exponential decoding of a malformed percent escape; npm reports no fix
  reachable from query-string 7). Both are in the bundle. query-string is
  used in getStateFromPath and getPathFromState, the deep link parsers. The
  app passes no linking configuration to its navigation container (checked:
  no `linking` prop anywhere in app/src), so no URL from outside the app is
  ever handed to that parser.
- @amazon-devices/react-native-async-storage__async-storage is installed
  under the alias name @react-native-async-storage/async-storage, which is
  what the bundle shows; npm reports it under its real name.
- lodash is here because the bundle carries lodash/isEqual and lodash/omit,
  for React prop comparison, with the prop names to omit written in this
  repository's source. The copy in the bundle is the hoisted 4.18.1, which
  npm reported clean on Oct 11. The findings npm still lists under the name
  belong to two nested copies that are in neither bundle: 4.17.21 pinned
  exactly by @amazon-devices/kepler-cli-platform and 4.17.23 pinned by
  @microsoft/api-extractor, both Node build tools.
- react-devtools-core is required by react-native's setUpReactDevTools only
  inside an `if (__DEV__)` block, so the Release bundle drops it and the Debug
  bundle, which is what the recorded demo used, carries its dist/backend.js.
  That file requires neither ws nor shell-quote (checked by grep, and neither
  is in either bundle); those two serve the Node side of DevTools. The
  advisory with its own name concerns the browser extension's authorization.

What the app parses from outside itself: a flash map, through its own reader
in app/src/calmframes/flashMap.ts, which refuses anything it does not
understand; a video and its captions, through the platform player; and the
household record it wrote itself. None of that reaches the code paths these
advisories describe.

What would change this: Amazon publishing an SDK 0.24 point release with newer
pins, which is worth checking before the Oct 21 release build.
"""
packages = [
  "@amazon-devices/kepler-content-personalization",
  "@amazon-devices/kepler-epg-provider",
  "@amazon-devices/kepler-file-system",
  "@amazon-devices/kepler-media-controls",
  "@amazon-devices/keplermediadescriptor",
  "@amazon-devices/keplerscript-appstore-iap-lib",
  "@amazon-devices/keplerscript-netmgr-lib",
  "@amazon-devices/keplerscript-turbomodule-api",
  "@amazon-devices/react-native-async-storage__async-storage",
  "@amazon-devices/react-native-device-info",
  "@amazon-devices/react-native-kepler",
  "@amazon-devices/react-native-localize",
  "@amazon-devices/react-native-vector-icons",
  "@amazon-devices/react-native-w3cmedia",
  "@amazon-devices/react-navigation__core",
  "@amazon-devices/react-navigation__native",
  "@amazon-devices/security-manager-lib",
  "decode-uri-component",
  "lodash",
  "query-string",
  "react-devtools-core",
]
