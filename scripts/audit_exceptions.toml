[[exception]]
group = "developer-tooling"
ecosystem = "npm"
ships = false
accepted_by = "Alex, on the infrastructure and security lane's recommendation"
review_by = "2026-10-21"
why = """
Test, packaging and command line helpers that run on a developer machine or on
a CI runner, over this repository's own files. The advisories are denial of
service, prototype pollution and path traversal reached through input to those
tools: a crafted glob pattern, a crafted temporary directory name, a crafted
command line. Nothing outside this project supplies any of that, and none of
these is called by the app while a video is playing.

Most have no fix inside the tree Amazon pins: the fix is a major version of a
parent that the SDK holds at an older one. The ones that do have a fix
(@microsoft/*, @rushstack/*, metro-cache, shell-quote, source-map-resolve, toml)
are reached only through `npm audit fix`, which rewrites app/package-lock.json
under the pinned SDK and is a change the app lane has to make and test on a
device, not one to slip into a security pass.

The honest summary: this is the build machine's risk, not the television's.
"""
packages = [
  "@jest/fake-timers",
  "jest-haste-map",
  "jest-message-util",
  "jest-util",
  "@microsoft/api-extractor",
  "@microsoft/api-extractor-model",
  "@microsoft/tsdoc-config",
  "@rushstack/node-core-library",
  "@rushstack/terminal",
  "@rushstack/ts-command-line",
  "node-notifier",
  "inquirer",
  "external-editor",
  "tmp",
  "shell-quote",
  "cross-spawn",
  "execa",
  "os-locale",
  "mem",
