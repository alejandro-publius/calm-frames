[[exception]]
group = "left-over-from-the-sample"
ecosystem = "npm"
ships = false
accepted_by = "Alex, on the infrastructure and security lane's recommendation"
review_by = "2026-10-05"
why = """
Two dependencies the sample brought that Calm Frames does not use.

xmldom 0.6.0 is a direct dependency with sixteen advisories against it, several
critical, and no fix in the 0.6 line. Nothing in app/src or app/test imports it:
`npm ls xmldom` shows it hanging off the app package and nothing else. The fix
is to delete the line from app/package.json, which is the app lane's file and
their manifest to regenerate, so it is written here as a recommendation with a
short review date rather than done from this lane.

lodash 4.17.21 has a fix inside the range app/package.json already allows
(`~4.17.21`), so `npm update lodash` in app/ takes it without touching
package.json. One file imports it. Same lane, same short date.

This entry expires two weeks before the release build on purpose. If it is
still here on Oct 5, the answer is no longer "we will get to it".
"""
"packages" = ["xmldom", "lodash"]
[exception.advisories]
"lodash" = ["1115806", "1115810", "1120370"]
"xmldom" = ["1091573", "1096547", "1117098", "1117892", "1117895", "1117898", "1117901", "1158516", "1193688", "1193691", "1193694", "1193698", "1193703", "1193706", "1193710", "1193713"]
