[[exception]]
group = "not-in-the-device-bundle"
ecosystem = "npm"
ships = false
accepted_by = "Claude, Oct 11 2026 session, on the infrastructure and security lane's reading; for Alex to confirm at the Oct 21 review"
review_by = "2026-10-21"
why = """
None of these is in the Release or the Debug bundle built on Oct 11
(results/bundle_packages_2026-10-11.json). They run on a developer's machine
or a CI runner, over this repository's own files: jest and its helpers, babel
and istanbul, Metro and the React Native community CLI, the Vega CLI platform
(@amazon-devices/kepler-cli-platform) and its manifest builder, Microsoft's
API Extractor and the Rushstack libraries it pulls in, the TypeScript ESLint
plugin, and the small utilities under them (micromatch, braces, minimatch,
fast-glob, globby, js-yaml, argparse, sprintf-js, cosmiconfig, ajv, yargs,
tmp, shell-quote, cross-spawn, execa, ws, uuid, toml and the
rest).

Two names here look like they should ship and do not. react-native 0.83.0 is
not in the bundle because the kepler platform resolves `react-native` to
@amazon-devices/react-native-kepler, Amazon's build of it, which is in the
other group; Meta's package is listed by npm for depending on the community
CLI and on react-devtools-core, and the ReDoS advisory carrying its own name
(GHSA-7f53-fmmv-mfjv, versions below 0.62.3) belongs to the react-native
0.60.6 copy that react-native-tscodegen-types carries for its type
definitions. react-native-tscodegen-types itself is a code generation
dependency of @amazon-devices/security-manager-lib and is in neither bundle.

Why the list is long in October: four advisories published in October 2026
sit under tools everything else depends on, and npm lists every package on
the path. braces (stack exhaustion on a deeply nested brace pattern,
GHSA-vfj7-8cjw-p6xm) sits under micromatch, so under fast-glob,
jest-haste-map, Metro's file map and jscodeshift, and from there under every
jest and Metro package. sprintf-js (unbounded precision specifier,
GHSA-hp3w-g68c-fv3c) sits under argparse 1 and js-yaml 3, so under
cosmiconfig, istanbul and the Rushstack command line. shell-quote (command
injection through a line terminator, GHSA-pqg4-j6r4-53mv, beside its two
older findings) sits under the community CLI's editor launcher and under
DevTools' Node side. The inputs these take, a glob
pattern, a format string or a shell command, come from this
repository's own configuration and test files, never from a video, a map or
anything a viewer controls.

Most of these have no fix inside the tree Amazon pins: the fix is a major
version of jest, Metro or the community CLI that react-native 0.83 does not
take. `npm audit fix --force` would rewrite app/package-lock.json under the
pinned SDK and is a change the app lane has to make and test on a device,
not one to slip into a security pass.

The summary: this is the build machine's risk, not the television's.
"""
