# Dependency audit exceptions.
#
# One entry per reason, not one per package. Each entry names the packages it
# covers, the advisory ids that were read when it was accepted, who accepted it,
# why, and the date it has to be looked at again. scripts/dep_audit.py fails if
# a package has no entry, if an advisory appears that is not in the list, or if
# a review date has passed. So this file cannot quietly go stale.
#
# The advisories tables are written by `make audit-update`, not by hand. The
# words are written by hand, always.
#
# What this file does not claim: that any of these packages is absent from the
# bundle that reaches the device. Working that out needs Metro's module graph
# from a release build, which nobody here has read yet. The exceptions are
# written to hold either way.

[[exception]]
group = "vega-sdk-and-react-native"
ecosystem = "npm"
ships = true
accepted_by = "Alex, on the infrastructure and security lane's recommendation"
review_by = "2026-10-21"
why = """
These are Amazon's Vega SDK 0.24 packages, React Native 0.83 and the toolchain
those two pull in. The project pins SDK 0.24.9914 and the sample at tag
v0.24-RN83 because that is the pair the device runs; the app will not build or
sideload against anything else. There is no version of react-native we can move
to that Vega 0.24 supports, so "upgrade" is not an option that leaves a working
app.

What the advisories are: ReDoS in react-native's own regular expressions,
improper authorization in react-devtools-core, and a set of denial of service
issues in metro and the community CLI. All of them need input we control. The
app parses two things from outside itself, a flash map and a video, and neither
goes near these packages: the map goes through the reader in
app/src/calmframes/flashMap.ts, which parses it itself and refuses anything it
does not understand, and the video goes to the platform player.

What would change this: Amazon publishing an SDK 0.24 point release with newer
pins, which is worth checking before the Oct 21 release build.
"""
packages = [
  "@amazon-devices/kepler-cli-platform",
  "@amazon-devices/kepler-module-manifest-builder",
  "@amazon-devices/react-native-kepler",
  "@amazon-devices/react-navigation__core",
  "@amazon-devices/react-navigation__native",
  "@amazon-devices/security-manager-lib",
  "react-native",
  "react-native-tscodegen-types",
  "react-devtools-core",
  "metro",
  "metro-cache",
  "metro-config",
  "metro-core",
  "metro-inspector-proxy",
  "@react-native-community/cli",
  "@react-native-community/cli-platform-android",
  "@react-native-community/cli-platform-ios",
  "fbjs",
  "fbjs-scripts",
  "isomorphic-fetch",
  "node-fetch",
  "logkitty",
  "xcode",
  "sane",
]
[exception.advisories]
"@amazon-devices/kepler-cli-platform" = []
"@amazon-devices/kepler-module-manifest-builder" = []
"@amazon-devices/react-native-kepler" = []
"@amazon-devices/react-navigation__core" = []
