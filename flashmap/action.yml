name: flashmap flash check
description: >-
  Fail a pull request that adds or changes an image or video which breaks WCAG 2.2 Success
  Criterion 2.3.1, the general and red flash thresholds.
author: Calm Frames
branding:
  icon: eye-off
  color: purple

inputs:
  profile:
    description: "Rule set to measure against: wcag or broadcast."
    required: false
    default: wcag
  peak-nits:
    description: "Assumed peak white in cd/m2. Only used by the broadcast profile."
    required: false
    default: ""
  paths:
    description: >-
      Newline separated files to check. Leave empty to check the image and video files this
      pull request adds, changes, copies or renames.
    required: false
    default: ""
  analysis-width:
    description: "Working width in pixels. Smaller is faster and area fractions are unchanged."
    required: false
    default: "192"
  fail-on-error:
    description: "Fail when a file cannot be measured, instead of skipping it."
    required: false
    default: "false"
  python-version:
    description: "Python to run flashmap on."
    required: false
    default: "3.12"
  flashmap-version:
    description: >-
      What to install. A version specifier such as ==1.0.0, or a path to a checkout of this
      package.
    required: false
    default: "==1.0.0"

outputs:
  failed-count:
    description: "How many files broke the thresholds."
    value: ${{ steps.check.outputs.failed-count }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install flashmap
      shell: bash
      run: |
        set -euo pipefail
        spec="${{ inputs.flashmap-version }}"
        if [ -d "$spec" ]; then
          python -m pip install --disable-pip-version-check "$spec"
        else
          python -m pip install --disable-pip-version-check "flashmap$spec"
        fi

    - name: Work out which files to check
      id: files
      shell: bash
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/flashmap-files.txt"
        if [ -n "${{ inputs.paths }}" ]; then
          printf '%s\n' "${{ inputs.paths }}" > "$list"
        elif [ -n "${BASE_SHA:-}" ]; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > "$list"
        else
          # Not a pull request. Check everything tracked, which is the right thing on a
          # scheduled or manual run.
          git ls-files > "$list"
        fi
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "Candidate files:"
        cat "$list"
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Check for flashing above the thresholds
      id: check
      shell: bash
      run: |
        set -uo pipefail
        args=(--changed-from "${{ steps.files.outputs.list }}")
        args+=(--profile "${{ inputs.profile }}")
        args+=(--analysis-width "${{ inputs.analysis-width }}")
        if [ -n "${{ inputs.peak-nits }}" ]; then
          args+=(--peak-nits "${{ inputs.peak-nits }}")
        fi
        if [ "${{ inputs.fail-on-error }}" = "true" ]; then
          args+=(--fail-on-error)
        fi
        set +e
        python -m flashmap.ci "${args[@]}"
        status=$?
        set -e
        echo "failed-count=$status" >> "$GITHUB_OUTPUT"
        if [ "$status" -ne 0 ]; then
          echo "::error title=WCAG 2.3.1::This change adds flashing above the general or red flash thresholds. See the job summary. Do not open the file in a player."
        fi
        exit $status
