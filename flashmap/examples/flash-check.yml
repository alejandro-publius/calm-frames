# Sample workflow. Copy this to .github/workflows/flash-check.yml in a repository that holds
# images or video, and every pull request that adds or changes one gets checked against WCAG
# 2.2 Success Criterion 2.3.1.
#
# The check needs the base commit to work out what changed, so the checkout needs enough
# history for a diff. fetch-depth: 0 is the simple way to be sure.

name: Flash check

on:
  pull_request:
    paths:
      - "**.mp4"
      - "**.mov"
      - "**.mkv"
      - "**.webm"
      - "**.gif"
      - "**.png"
      - "**.webp"
      - "**.avif"

permissions:
  contents: read

jobs:
  flash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for flashing above the WCAG thresholds
        # Pinned to a commit on this repository, because no release tag and no
        # PyPI release exist yet; the pin moves to the judged tag once it is cut.
        # With no flashmap-version given, the action installs flashmap from the
        # checkout it came from, so the pin above is the version you get.
        uses: alejandro-publius/calm-frames/flashmap@1b088d17c53343025b2ca37cf7615e809709ba8b
        with:
          profile: wcag
          # Uncomment to fail when a file cannot be measured, for example an HDR master.
          # fail-on-error: "true"
