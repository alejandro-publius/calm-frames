# mypy for the pipeline, run from the repository root:
#   python -m mypy --config-file pipeline/mypy.ini
#
# Not strict, unlike flashmap's: the pipeline is not a published library and
# most of its functions predate annotations. check_untyped_defs reads inside the
# unannotated ones too, which is where Oct 11's eleven findings were: values
# that could be None reaching float(), int() and the key loader, and a variable
# reused with a second type. Each was a narrowing mypy could not follow, not a
# fault at run time; the fixes say so in the code. The tests and the CDK app are
# left out, the app because its imports need the CDK installed.
[mypy]
python_version = 3.12
files = pipeline/*.py
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
ignore_missing_imports = True
follow_imports = silent
