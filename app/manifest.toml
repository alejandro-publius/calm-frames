#
# Based on AmazonAppDev/vega-video-sample (MIT-0), tag v0.24-RN83.
# Calm Frames changes: renamed the package, and removed the service and task
# components (account login, content personalization, install and EPG sync)
# with everything that needed them. On SDK 0.24 with React Native 0.83 those
# headless components can crash the app at launch, and Calm Frames does not
# use them.
#
schema-version = 1                          # [required] Schema version used in the manifest file. Currently, value must be 1

[package]
id = "io.github.alejandropublius.calmframes"  # [required] Package identifier. Developer mode only sideloads packages
                                              #            whose id does not start with com.amazon.
title = "Calm Frames"                       # [required] string name for the app, used to display on FireTV launcher and Appstore.
version = "0.1.0"                           # [required] Version string of the app, recommended to use semver, but any other string may be used.
icon = "@image/CalmFrames.png"              # [required] 512x512 PNG under 1 MB, built by assets/brand/render.sh.
                                            # Amazon scopes this one to Settings -> Applications ->
                                            # Manage Installed Applications. The tile on the Fire TV home
                                            # screen is a separate 1280x720 Appstore asset, in docs/brand/.
                                            # vpt checks the @image/ name and that the file exists, and
                                            # nothing else: a wrong size is caught at Appstore review.

[os.version]
min = "1.2"
target = "1.2"

## ------------------------------------------------------------------------------
## The [components] section declares the application components in the package.
## Calm Frames has one interactive component and no services or tasks.
## ------------------------------------------------------------------------------
[components]
[[components.interactive]]
id = "io.github.alejandropublius.calmframes.main"  # [required] Unique component identifier
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories = [
    "com.amazon.category.main",                 # [required] Marks this as the main launchable component for the app.
    "com.amazon.category.kepler.media"          # [optional] Required for media integrations, including Vega Media Controls.
]

launch-type = "singleton"                       # [optional] Only one running instance of this component exists.

## ------------------------------------------------------------------------------
## The [processes] section describes which components run in a shared process.
## ------------------------------------------------------------------------------
[processes]
[[processes.group]]
component-ids = ["io.github.alejandropublius.calmframes.main"]

## ------------------------------------------------------------------------------
## The [wants] section declares optional capabilities. Handle fallbacks in code.
## ------------------------------------------------------------------------------
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.kepler.pcon.service.main"

[[wants.service]]
id = "com.amazon.drm.key" # Required for DRM video playback

[[wants.service]]
id = "com.amazon.drm.crypto" # Required for DRM video playback

# ------------------------------------------------------------------------------
# MediaPlayer/MediaTransform
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

# ------------------------------------------------------------------------------
# Remote button events.
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.inputd.service"

# ------------------------------------------------------------------------------
# MediaControls
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

# ------------------------------------------------------------------------------
# Accessibility (VoiceView announcements)
# ------------------------------------------------------------------------------
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

# ------------------------------------------------------------------------------
# Required for GIPC SR, used by audio and video playback
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.gipc.uuid.*"

# ------------------------------------------------------------------------------
# Audio stream
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.audio.stream"

# ------------------------------------------------------------------------------
# Volume and other audio controls
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# ------------------------------------------------------------------------------
# Network information
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.network.service"

# ------------------------------------------------------------------------------
# In-App Purchasing (IAP), still used by the sample's details screen
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.iap.core.service"

[[wants.module]]
id = "/com.amazon.iap.core@IIAPCoreUI"

[[wants.service]]
id = "com.amazon.iap.tester.service"

[[wants.module]]
id = "/com.amazonappstore.iap.tester@IIAPTesterUI"

## ------------------------------------------------------------------------------
## The [needs] section declares required system capabilities.
## ------------------------------------------------------------------------------
[needs]
# ------------------------------------------------------------------------------
# Audio and video
# ------------------------------------------------------------------------------
[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[[needs.privilege]]
id = "com.amazon.privilege.security.file-sharing" # Required for DRM video playback

# ------------------------------------------------------------------------------
# Network information
# ------------------------------------------------------------------------------
[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

# ------------------------------------------------------------------------------
# In-App Purchasing (IAP)
# ------------------------------------------------------------------------------
[[needs.module]]
id = "/com.amazon.kepler.appstore.iap.purchase.core@IAppstoreIAPPurchaseCoreService"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

## ------------------------------------------------------------------------------
## The [offers] section declares what this package offers to other packages.
## ------------------------------------------------------------------------------

[[needs.module]]
id = "/com.amazon.kepler.kepler_content_personalization_1@IKeplerContentPersonalization_3"

[[needs.module]]
id = "/com.amazon.kepler.kepler_epg_provider_1@IKeplerEpgProvider_9"

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.appstore_iap_lib_2@IAppstoreIapLib_12"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_netmgr_lib_2@INetmgrTurbomodule_0"

[[needs.module]]
id = "/com.amazon.kepler.lottie_3@ILottie_0"

[[needs.module]]
id = "/com.amazon.kepler.linear_gradient_2@ILinearGradient_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.device_info_2@IDeviceInfo_1"

[[needs.module]]
id = "/com.amazon.kepler.gesture_handler_4@IGestureHandler_0"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.localize_2@ILocalize_1"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_4@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.safe_area_context_8@ISafeAreaContext_0"

[[needs.module]]
id = "/com.amazon.kepler.screens_3@IScreens_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.vector_icons_2@IVectorIcons_1"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.worklets_1@IWorklets_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__core_8@INavigation__Core_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__drawer_8@INavigation__Drawer_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__elements_8@INavigation__Elements_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_8@INavigation__Native_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__routers_8@INavigation__Routers_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__stack_8@INavigation__Stack_0"

[[needs.module]]
id = "/com.amazon.kepler.security_manager_lib_1@ISecurityManagerLib_0"





























[offers]
#Required for GIPC SR
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "io.github.alejandropublius.calmframes.main"

[[offers.module]]
id = "/io.github.alejandropublius.calmframes.main@IMod1"
includes-messages = [
    "pkg://io.github.alejandropublius.calmframes.main"
]

## ------------------------------------------------------------------------------
## The [[message]] section defines the URIs this package introduces.
## ------------------------------------------------------------------------------
[[message]]
uri = "pkg://io.github.alejandropublius.calmframes.main"  # [required] main component launch uri
sender-privileges = ["*"]                                 # [required] anyone can launch this app
receiver-privileges = ["self"]                            # [required] only this app can receive this launch message

## ------------------------------------------------------------------------------
## The [[extras]] section holds configuration for Amazon feature integrations.
## Calm Frames keeps Vega Media Controls, which carries the Alexa and remote
## transport commands that every seek path has to stay safe under.
## ------------------------------------------------------------------------------
[[extras]]
key = "interface.provider"                                # Designates the component that implements the interfaces below.
component-id = "io.github.alejandropublius.calmframes.main"

[extras.value.application]
# ------------------------------------------------------------------------------
# Vega Media Controls (VMC)
# ------------------------------------------------------------------------------
[[extras.value.application.interface]]
interface_name = "com.amazon.kepler.media.IMediaPlaybackServer"
command_options = [
    "StartOver",
    "Previous",
    "Next",
    "SkipForward",
    "SkipBackward",
]
attribute_options = ["AudioAdvanceMuted"]
features = ["AdvancedSeek", "VariableSpeed", "AudioTracks", "TextTracks"]
