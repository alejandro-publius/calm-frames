name: Prepare retired sample dependency graph
on:
  push:
    branches: [codex/final-dependency-preparation-2026-10-27]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Regenerate the lock with normal npm
        working-directory: app
        run: |
          test "$(npm --version)" = 10.9.8
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
      - name: Regenerate the pinned bills of materials
        run: |
          python -m pip install cyclonedx-bom==7.4.0 cyclonedx-python-lib==11.12.0
          python3 scripts/sbom.py
      - name: Typecheck and focused sample tests
        working-directory: app
        run: |
          npm run typecheck
          npx eslint src/screens/SettingsScreen.tsx test/screens/SettingScreen.test.tsx jest.setup.ts
          npx jest --runInBand --coverage=false --updateSnapshot test/screens/SettingScreen.test.tsx
      - name: Validate actual dependency consumers
        working-directory: app
        run: |
          node - <<'JS'
          const fs=require('node:fs'), cp=require('node:child_process');
          const files=fs.readdirSync('tools').filter(n=>n.endsWith('.test.mjs')&&(n.includes('dependency')||n.startsWith('legacy_')||n==='uri_decoder_metro.test.mjs')).sort().map(n=>'tools/'+n);
          const result=cp.spawnSync(process.execPath,['--test',...files],{stdio:'inherit'});
          process.exit(result.status??1);
          JS
      - name: Fresh npm advisory check
        working-directory: app
        run: npm audit --json
      - name: Preserve exact generated public records
        if: always()
        run: |
          mkdir -p .logs/dependency-preparation
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil, subprocess
          root=pathlib.Path('.'); out=root/'.logs/dependency-preparation'
          paths=['app/package.json','app/package-lock.json','docs/SBOM.app.cdx.json','docs/SBOM.ingest.cdx.json','docs/SBOM.cdk.cdx.json','results/sbom.json','app/test/screens/__snapshots__/SettingScreen.test.tsx.snap']
          for name in paths:
              p=root/name
              if not p.is_file():
                  print('CF_MISSING_FILE '+name,flush=True);continue
              raw=p.read_bytes(); dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
              encoded=base64.b64encode(raw).decode('ascii');chunks=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
              blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              print('CF_GENERATED_FILE '+json.dumps({'path':name,'bytes':len(raw),'git_blob_sha':blob,'parts':len(chunks)},separators=(',',':')),flush=True)
              for i,chunk in enumerate(chunks):print('CF_GENERATED_DATA '+name+' '+str(i)+' '+chunk,flush=True)
              print('CF_GENERATED_END '+name,flush=True)
          old=json.loads(subprocess.check_output(['git','show','HEAD:app/package-lock.json'],text=True))['packages']
          new=json.loads(pathlib.Path('app/package-lock.json').read_text())['packages']
          delta={'removed':[p for p in old if p not in new],'added':[p for p in new if p not in old],'changed_existing_versions':[{'path':p,'before':old[p].get('version'),'after':new[p].get('version')} for p in old.keys()&new.keys() if old[p].get('version')!=new[p].get('version')]}
          (out/'graph-delta.json').write_text(json.dumps(delta,indent=2)+'\n');print('CF_GRAPH_DELTA '+json.dumps(delta,separators=(',',':')),flush=True)
          PY
          git diff --stat
          git diff -- app/package-lock.json docs/SBOM.app.cdx.json results/sbom.json app/test/screens/__snapshots__/SettingScreen.test.tsx.snap > .logs/dependency-preparation/generated.patch
      - name: Save generated records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retired-network-sample-generated-records
          path: .logs/dependency-preparation
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
