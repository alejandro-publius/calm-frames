name: Publish flashmap to PyPI

# Trusted publishing: PyPI accepts the upload because GitHub vouches for this
# workflow in this repository, so there is no API token anywhere. Nothing to
# store, nothing to rotate, nothing to leak.
#
# Alex's steps, once, before this can publish anything. docs/RELEASE.md has the
# same list with the screens described:
#
#   1. make a PyPI account and turn on two factor authentication
#   2. PyPI > Your projects > Publishing > Add a pending publisher, with
#        PyPI project name : flashmap
#        Owner             : alejandro-publius
#        Repository name   : calm-frames
#        Workflow name     : publish-flashmap.yml
#        Environment name  : pypi
#   3. in this repository: Settings > Environments > New environment > pypi,
#      and add yourself as a required reviewer so a publish waits for a click
#
# Until all three are done this workflow builds and checks the package and
# stops. It cannot publish by accident: the publish job only runs when someone
# starts it by hand and types "publish", and then the environment holds it for
# a review.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload to PyPI. Anything else builds and checks only.'
        required: true
        default: "dry-run"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Build the sdist and the wheel
        working-directory: flashmap
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build

      - name: Check the metadata PyPI will render
        working-directory: flashmap
        run: python -m twine check --strict dist/*

      - name: Say what would be uploaded
        working-directory: flashmap
        run: |
          echo "### flashmap build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flashmap-dist
          path: flashmap/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-24.04
    # The environment is the second lock. Add a required reviewer to it and a
    # publish waits for a person even after someone typed the word.
    environment:
      name: pypi
      url: https://pypi.org/p/flashmap
    permissions:
      # The only permission trusted publishing needs. No PyPI token exists.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flashmap-dist
          path: dist

      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # No user, no password, no api token. The OIDC token from the job is
          # what PyPI checks against the pending publisher.
          print-hash: true
