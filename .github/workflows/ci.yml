name: CI

# Every job runs on ubuntu-latest. The repository is private until the final
# checks on Oct 21, and private repositories have a limited pool of free
# Actions minutes, where macOS runners cost ten times what Linux costs. The
# heavy work stays off CI: the conformance suite and the Docker baseline
# images are built locally or on a nightly schedule with a small sample.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Vega app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        working-directory: app
        # --ignore-scripts skips the Shaka Player build, which clones a large
        # repository and needs a JDK. The tests mock the player, so CI does
        # not need the built bundle.
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Check prepared package assets and tamper controls
        working-directory: app
        run: node tools/check_prepared_library.mjs && node --test tools/check_prepared_library.test.mjs
      - name: Lint
        working-directory: app
        run: npx eslint src test --ext .ts,.tsx
      - name: Test
        working-directory: app
        run: npx jest --colors=false --ci
      - name: Hook package guard tests
        run: npm --prefix hook run test:package
      - name: Check the installed offline hook consumer
        # Reuses the current app's Vega peer types after installing the packed
        # tarball in a fresh consumer. This is not an npm publication or a
        # physical-device check, and it needs no registry access.
        run: npm --prefix hook run check:package

  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install packages that exist
        run: |
          python -m pip install --upgrade pip
          for pkg in flashmap pipeline eval; do
            if [ -f "$pkg/pyproject.toml" ]; then
              echo "installing $pkg"
              pip install -e "./$pkg[dev]" || pip install -e "./$pkg"
            fi
          done
          # eval/ has no pyproject.toml, so the loop above skips it and nothing
          # installs what its tests import. flashmap brings av, numpy and
          # cryptography, and flashmap[dev] brings pytest, hypothesis and pyyaml.
          # matplotlib is the one left over, and without it
          # eval/tests/test_labeling_plots.py fails to import and takes the whole
          # job down with it, which is what hid the scheduler failure below.
          pip install pytest==9.1.1 matplotlib==3.11.2
      - name: Test
        run: |
          # Skip anything marked slow: the full conformance suite runs locally
          # or nightly, not on every push.
          targets=""
          for dir in flashmap pipeline eval; do
            if [ -d "$dir" ] && ls "$dir"/**/test_*.py "$dir"/test_*.py "$dir"/tests >/dev/null 2>&1; then
              targets="$targets $dir"
            fi
          done
          if [ -n "$targets" ]; then
            echo "testing:$targets"
            pytest -q -m "not slow" $targets
          else
            echo "no Python tests yet"
          fi

  ui-flashmap:
    name: The app's own UI passes flashmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install flashmap
        run: pip install -e ./flashmap
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund
      - name: Render every screen and check it for flashing
        # Kid mode hides flashing in other people's video. An app that flashed
        # its own cards while doing it would be absurd, so every screen and
        # transition is rendered, turned into a lossless video and run through
        # the same analyzer we point at content.
        working-directory: app
        run: npm run ui:flashmap

      - name: Check every image the app and the listing ship
        # The screens above are what the app draws. These are what it ships: the
        # icon the platform reads and the tile the Appstore shows. Each is
        # analysed on its own, and eval/tests/test_brand_assets.py holds the
        # check both to covering all of them and to failing on one that really
        # flashes.
        run: python eval/brand_assets_check.py

      - name: Check the report page as a reader sees it
        # flashmap's report page draws a flash timeline. Its lanes are checked
        # as pictures in flashmap/tests/test_report.py, which is not what a
        # reader sees: a reader sees the page, lanes at layout size with text
        # around them. This renders the whole page in the headless Chrome the
        # runner already has, cuts it into 1280x720 display frames and runs the
        # analyzer over each one under the broadcast profile, which is the one
        # that carries the regular pattern rule. It carries its own negative
        # control, a page whose timeline is a stripe pattern, and refuses it.
        run: python eval/report_page_check.py

  hardening:
    name: Mutation gate, property tests and the map fuzz corpus
    runs-on: ubuntu-latest
    # The longest job here, about twenty minutes. It breaks every safety guard on purpose
    # and runs the tests that have to notice, one guard at a time, and most of that time is
    # the pipeline verify suite, which renders video. It earns the minutes: a green test
    # suite that has never been seen to fail is the one thing this project cannot afford.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "./flashmap[dev]" || pip install -e ./flashmap
          pip install pytest==9.1.1 hypothesis==6.168.0
      - name: Install the app's dependencies
        working-directory: app
        # The property tests compile the app's scheduler with the app's own tsc and run it,
        # so what they answer about is the code that ships rather than a copy of it.
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund
      - name: Property tests and the map fuzz corpus
        # CALM_FRAMES_REQUIRE_NODE=1, set by the target, turns a missing node from a skip
        # into a failure. A silently skipped property test is a green tick for nothing.
        run: make properties
      - name: The mutation gate
        # --check runs the gate and then fails if it disagrees with results/mutation.json:
        # a new survivor, a lower kill rate, or a different number of mutations.
        run: make mutate MUTATE_ARGS="--check --out .logs/mutation-ci.json"
      - name: Retain the actual mutation measurement, including a failed drift check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-measurement-${{ github.run_attempt }}
          path: .logs/mutation-ci.json
          include-hidden-files: true
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact

  numbers:
    name: Published numbers match results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check every published number against results/
        run: python3 eval/readme_sync.py --check
      - name: Rebuild the lead time summary from its own events
        run: python3 eval/verify_gate1_archive.py
      - name: Recount the integration diff the README quotes
        run: python3 eval/integration_diff_stats.py --check
      - name: One baseline directory, one tool version
        run: python3 eval/baseline_versions.py
      - name: Re-score the pattern rule's text and UI report from its own rows
        run: python3 eval/pattern_text_precision.py --check
