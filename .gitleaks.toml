# Secret scanning config.
#
# The default rules are kept. The allowlist below only covers directories that
# hold generated or third-party files that are never committed: the Shaka
# Player checkout and the bundles built from it during npm install, installed
# packages, build output, and the CDK template written by `make synth`.
# Scanning them produces hundreds of false matches from minified demo code,
# which buries a real finding.
#
# Nothing under our own source, docs, results or infrastructure is allowlisted.
#
# One exception is listed by value rather than by path, below, because the
# alternative would have been to allowlist a directory of real tests.

[extend]
useDefault = true

[allowlist]
description = "Generated and third-party files, none of which are committed"
paths = [
  '''app/src/w3cmedia/shakaplayer/dist/''',
  '''app/shaka-setup/shaka-player/''',
  '''node_modules/''',
  '''app/build/''',
  '''cdk\.out/''',
  '''\.venv/''',
]

# The offline demo's Ed25519 PUBLIC key, which app/test/calmframes/*.ts and
# *.tsx carry inline so a test can check a signature without reading a file.
# gitleaks' generic-api-key rule sees 44 characters of base64 and cannot tell a
# published public key from a secret, so this names that one string and nothing
# else.
#
# Checked on Sep 17, 2026 rather than assumed: this is byte for byte the key in
# app/test/calmframes/fixtures/offline_demo_key.pub.pem, whose key id is
# sha256:9d32df3b18c97a7e895a2f76bf58c189259a8e2de1b1ca02da4830d1e057b26a. The
# private half has never been in this repository and docs/SECURITY.md says
# where it lives.
#
# If the demo key is ever rotated this line stops matching and the new one gets
# flagged, which is the right way round: someone has to look at it.
regexes = [
  '''533gF/bCDXyQppRnqiiT41\+JwyyUYRN8P4YVZnCbKLQ=''',
]
